[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pir-positional-ir"
version = "1.0.0"
description = "Pure-IR positional inverted index: phrase queries, proximity queries, BM25, explainability, Cranfield evaluation"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
